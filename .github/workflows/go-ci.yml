name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Test and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Test Go modules and enforce 80% coverage where tests exist
        run: sh scripts/coverage.sh 80
