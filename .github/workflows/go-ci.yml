name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-quality:
    name: Go lint, vet, build, test, and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-test-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            **/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(find packages services tools -type f -name '*.go' -print0 | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Refresh module checksums
        shell: bash
        run: |
          while IFS= read -r modfile; do
            module=${modfile%/go.mod}
            [[ "$module" == "packages/eventkit" ]] && continue
            (cd "$module" && go mod tidy)
          done < <(find packages services tools -type f -name go.mod | sort)
          (cd .github/security-tools && go mod tidy)

      - name: Ensure module manifests are committed
        run: git diff --exit-code -- ':(glob)**/go.mod' ':(glob)**/go.sum'

      - name: Vet and build every Go module
        run: bash scripts/ci-go.sh

      - name: Test every Go module and enforce 80% coverage where tests exist
        run: bash scripts/coverage.sh 80

  protobuf:
    name: Protobuf lint, build, and breaking-change check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Buf CLI image
        run: docker pull bufbuild/buf:1.73.0

      - name: Lint and build protobuf contracts
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace bufbuild/buf:1.73.0 lint
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace bufbuild/buf:1.73.0 build

      - name: Check compatibility against the target branch
        env:
          BUF_BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git branch --force "$BUF_BASE_BRANCH" "origin/$BUF_BASE_BRANCH"
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace bufbuild/buf:1.73.0 breaking --against ".git#branch=${BUF_BASE_BRANCH}"

  go-security:
    name: Go vulnerability and security scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go for security analyzers
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            **/go.sum

      - name: Install govulncheck and gosec
        working-directory: .github/security-tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck
          go install github.com/securego/gosec/v2/cmd/gosec
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan every Go module
        run: bash scripts/security-go.sh

  container-security:
    name: Build and scan service images
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: drukleague-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build shared service builder image
        run: docker build --tag drukleague-service-builder:local --file services/service-builder/Dockerfile .

      - name: Build application and microservice images
        run: |
          docker compose --file deploy/docker-compose.yml build \
            api auth user team player tournament registration match score fixture standings \
            venue official dzongkhag notification media report search analytics audit-log configuration

      - name: Pull Trivy scanner image
        run: docker pull aquasec/trivy:0.68.2

      - name: Scan every built image for critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^drukleague-ci-' | sort -u)
          if [[ ${#images[@]} -eq 0 ]]; then
            echo 'No service images were built.' >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            echo "Scanning $image"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/" \
              aquasec/trivy:0.68.2 \
              image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 "$image"
          done

  frontend-quality:
    name: Frontend role-permission tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test role page and action permissions
        run: node --test tests/frontend/role-permissions.test.js

  performance:
    name: k6 login and public standings performance
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: drukleague-performance
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SECRET: ci-only-jwt-secret-for-performance-tests
      BOOTSTRAP_ADMIN_USER: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start the API and its dependencies
        run: docker compose --file deploy/docker-compose.yml up -d postgres nats api

      - name: Wait for the API health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --file deploy/docker-compose.yml logs api postgres nats
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
        with:
          k6-version: '1.8.2'

      - name: Load test login and public standings
        env:
          API_BASE_URL: http://127.0.0.1:8080
        run: k6 run tests/performance/api-login-standings.js

      - name: Stop the test stack
        if: always()
        run: docker compose --file deploy/docker-compose.yml down --volumes --remove-orphans

  audit-event-e2e:
    name: API admin action reaches the audit log
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: drukleague-audit-e2e
      POSTGRES_PASSWORD: ci-only-audit-postgres-password
      JWT_SECRET: ci-only-audit-jwt-secret
      BOOTSTRAP_ADMIN_USER: ci-audit-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-audit-admin-password
      API_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build shared service builder image
        run: docker build --tag drukleague-service-builder:local --file services/service-builder/Dockerfile .

      - name: Start API, NATS, and Audit Log
        run: docker compose --file deploy/docker-compose.yml up -d postgres nats db-init api audit-log

      - name: Verify admin action is persisted by Audit Log
        run: bash tests/integration/audit-event-e2e.sh

      - name: Stop the test stack
        if: always()
        run: docker compose --file deploy/docker-compose.yml down --volumes --remove-orphans

  notification-e2e:
    name: MatchFinalized reaches team managers as notifications
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: drukleague-notification-e2e
      POSTGRES_PASSWORD: ci-only-notification-postgres-password
      JWT_SECRET: ci-only-notification-jwt-secret
      BOOTSTRAP_ADMIN_USER: ci-notification-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-notification-admin-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build shared service builder image
        run: docker build --tag drukleague-service-builder:local --file services/service-builder/Dockerfile .

      - name: Start the notification end-to-end service stack
        run: >-
          docker compose --file deploy/docker-compose.yml up -d
          postgres nats db-init auth user team tournament venue dzongkhag fixture official
          match score standings notification report

      - name: Wait for the split services to finish starting
        run: sleep 20

      - name: Verify MatchFinalized notifications end to end
        run: >-
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_default"
          -v "$GITHUB_WORKSPACE:/src" -w /src/tools/e2e
          -e E2E_ADMIN_USER="$BOOTSTRAP_ADMIN_USER"
          -e E2E_ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD"
          drukleague-service-builder:local go run .

      - name: Stop the test stack
        if: always()
        run: docker compose --file deploy/docker-compose.yml down --volumes --remove-orphans
