syntax = "proto3";
package drukleague.auth.v1;
option go_package = "github.com/drukleague/platform/packages/contracts/gen/drukleague/auth/v1;authv1";
import "google/protobuf/timestamp.proto";
import "drukleague/v1/user.proto";
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
}
message LoginRequest { string username=1; string password=2; }
message LoginResponse { string access_token=1; google.protobuf.Timestamp expires_at=2; drukleague.v1.User user=3; }
message RefreshTokenRequest { string refresh_token=1; }
message RefreshTokenResponse { string access_token=1; google.protobuf.Timestamp expires_at=2; }
message RevokeSessionRequest { string token_id=1; }
message RevokeSessionResponse { bool revoked=1; }