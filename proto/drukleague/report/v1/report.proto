syntax = "proto3";
package drukleague.report.v1;
option go_package = "github.com/drukleague/platform/packages/contracts/gen/drukleague/report/v1;reportv1";
import "google/protobuf/timestamp.proto";
service ReportService {
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse);
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
}
message ReportJob { string id=1; string report_type=2; string status=3; string download_url=4; google.protobuf.Timestamp created_at=5; }
message CreateReportRequest { string report_type=1; string tournament_id=2; string format=3; }
message CreateReportResponse { ReportJob report=1; }
message GetReportRequest { string id=1; }
message GetReportResponse { ReportJob report=1; }