syntax = "proto3";
package drukleague.player.v1;
option go_package = "github.com/drukleague/platform/packages/contracts/gen/drukleague/player/v1;playerv1";
import "google/protobuf/timestamp.proto";
service PlayerService {
  rpc CreatePlayer(CreatePlayerRequest) returns (CreatePlayerResponse);
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  rpc UpdatePlayer(UpdatePlayerRequest) returns (UpdatePlayerResponse);
}
message Player { string id=1; string team_id=2; string given_name=3; string family_name=4; string shirt_number=5; google.protobuf.Timestamp created_at=6; }
message CreatePlayerRequest { string team_id=1; string given_name=2; string family_name=3; string shirt_number=4; }
message CreatePlayerResponse { Player player=1; }
message GetPlayerRequest { string id=1; }
message GetPlayerResponse { Player player=1; }
message ListPlayersRequest { string team_id=1; int32 page_size=2; string page_token=3; }
message ListPlayersResponse { repeated Player players=1; string next_page_token=2; }
message UpdatePlayerRequest { string id=1; string given_name=2; string family_name=3; string shirt_number=4; }
message UpdatePlayerResponse { Player player=1; }