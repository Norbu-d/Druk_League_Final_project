services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drukleague
      POSTGRES_USER: drukleague
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drukleague-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drukleague -d drukleague"]
      interval: 5s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5

  db-init:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drukleague-local}
    volumes:
      - ./init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      DATABASE_URL: postgres://drukleague:${POSTGRES_PASSWORD:-drukleague-local}@postgres:5432/drukleague?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      APP_ENV: development
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-drukleague-dev}
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    # The monolith is kept as a fallback on 8079. To switch the web app back to it, swap
    # this port with the bff's and point nginx's /api at api:8080.
    ports:
      - "8079:8080"

  # Backend-for-frontend: the web app's REST API, served by calling the microservices.
  bff:
    build:
      context: ..
      dockerfile: services/bff/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
    depends_on:
      - auth
      - user
      - tournament
      - team
      - match
      - score
      - standings
      - fixture
      - official
    ports:
      - "8080:8080"

  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgres://drukleague:${POSTGRES_PASSWORD:-drukleague-local}@postgres:5432/auth_service?sslmode=disable
      GRPC_ADDR: :50051
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      MIGRATIONS_DIR: /app/migrations
      USER_SERVICE_ADDR: user:50051
      ACCESS_TOKEN_TTL: 30m
      REFRESH_TOKEN_TTL: 168h
    depends_on:
      db-init:
        condition: service_completed_successfully
  user:
    build:
      context: ..
      dockerfile: services/user/Dockerfile
    environment:
      DATABASE_URL: postgres://drukleague:${POSTGRES_PASSWORD:-drukleague-local}@postgres:5432/user_service?sslmode=disable
      GRPC_ADDR: :50051
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      MIGRATIONS_DIR: /app/migrations
      # Creates the first super admin in the User service if none exists (never overwrites one).
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-drukleague-dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
  team:
    build:
      context: ..
      dockerfile: services/team/Dockerfile
    environment:
