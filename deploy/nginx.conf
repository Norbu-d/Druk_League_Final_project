server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # The web app's API is the bff (microservices). The monolith stays reachable at api:8080 as a fallback.
  location /api/ { proxy_pass http://bff:8080/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /healthz { proxy_pass http://bff:8080/healthz; }
  location / { try_files $uri $uri/ /index.html; }
}
